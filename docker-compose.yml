version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: kisan_mitra_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kisan_mitra
      MYSQL_USER: kisan_user
      MYSQL_PASSWORD: kisan_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisan_mitra_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://kisan_user:kisan_password@db:3306/kisan_mitra
      DB_FALLBACK_SQLITE: "True"
      DEMO_MODE: "True"
      SECRET_KEY: kisan_mitra_super_secret_jwt_key
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisan_mitra_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
